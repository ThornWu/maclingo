<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>MacLingo · 麦译</title>
<style>
  :root { color-scheme: light dark; }
  body { width:300px; padding:22px; margin:0; font:14px/1.7 -apple-system,BlinkMacSystemFont,sans-serif; color:#253c32; background:#fff; }
  header { display:flex; align-items:center; gap:12px; }
  h1 { font-size:18px; margin:0; } header p { margin:0; font-size:12px; color:#637169; }
  p { margin:16px 0; } small { color:#637169; } kbd { background:#edf2ef; padding:2px 5px; border-radius:4px; }
  .setting { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 0 4px; }
  input { accent-color:#226b68; width:18px; height:18px; }
  a { color:#226b68; } footer { margin-top:16px; font-size:12px; }
  @media(prefers-color-scheme:dark) { body {background:#242b28;color:#edf2ef} small,header p {color:#adbbb2} kbd {background:#39473f} a {color:#a9dec8} }
</style>
<header><img src="icons/icon48.png" width="40" height="40" alt=""><div><h1>MacLingo · 麦译</h1><p>为 Mac 打造的 Chrome 划词翻译</p></div></header>
<p>在网页选中文字，右键选择「用麦译翻译」，或按 <kbd>Control + Shift + M</kbd>（Mac）。译文会显示在当前页面。</p>
<label class="setting" for="auto-selection"><span>划词自动翻译</span><input id="auto-selection" type="checkbox" role="switch" disabled></label>
<small>默认关闭。开启后，在网页正文中选中文字即可翻译。</small>
<p id="setting-status" role="status" aria-live="polite"></p>
<p>点击空白处或按 <kbd>Esc</kbd> 收起。</p>
<small>本机翻译，无需 API Key，不保存记录。首次使用可能需要点击卡片内的按钮下载语言包。需要支持 Translator API 的新版桌面 Chrome。浏览器内部页、扩展商店、内置 PDF 阅读器无法显示卡片。</small>
<footer><a href="https://github.com/thornfe/maclingo" target="_blank" rel="noopener noreferrer">GitHub · MIT 开源</a></footer>
<script src="help.js"></script>
</html>
